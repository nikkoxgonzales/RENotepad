name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rust toolchain
        run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy
      - name: Unit tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --release --locked -- -D warnings
